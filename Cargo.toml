[workspace]
resolver = "2"
members = ["crates/sk-core", "crates/sk-split", "crates/sk-chain", "crates/sk-store", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MoneyKeep Project contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/moneykeepproject/sharekeep"

[workspace.dependencies]
sk-core = { path = "crates/sk-core" }
sk-chain = { path = "crates/sk-chain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
# The same crates and versions as MoneyKeep (no new licences): hashing, SQLite, book
# encryption, file locking.
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled", "serialize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
zeroize = "1"
getrandom = "0.3"
unicode-normalization = "0.1"
fs4 = { version = "0.13", features = ["sync"] }
tempfile = "3"

# Key derivation is deliberately expensive; optimise it even in debug builds so the
# tests that open encrypted books stay quick (as in MoneyKeep).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = true
