[workspace]
resolver = "2"
members = ["crates/sk-core", "crates/sk-split", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MoneyKeep Project contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/moneykeepproject/sharekeep"

[workspace.dependencies]
sk-core = { path = "crates/sk-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
