[package]
name = "sk-client"
description = "ShareKeep client of the household service: HTTPS trusting only the hub's certificate authority, the outbox, and the local copy of a book's history"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sk-core.workspace = true
sk-chain.workspace = true
sk-ledger.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
rustls.workspace = true
getrandom.workspace = true
sha2.workspace = true
zeroize.workspace = true

# DPAPI, to seal secrets before they are written (seal.rs).
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile.workspace = true
