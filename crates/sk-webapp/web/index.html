<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>ShareKeep</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
<script src="/boot.js"></script>
<script src="/app.js" defer></script>
</head>
<body>
<header id="top">
  <button id="back" class="link light" hidden>‹ Back</button>
  <h1 id="title">ShareKeep</h1>
  <button id="sync" class="link light" hidden>Sync</button>
</header>
<nav id="tabs" class="chips" hidden></nav>
<main id="page"></main>
<nav id="nav" hidden>
  <button data-page="home"><span class="ico">⌂</span>Home</button>
  <button data-page="approvals"><span class="ico">✓</span>Approvals<b class="badge" hidden></b></button>
  <button data-page="settings"><span class="ico">⚙</span>Settings<b class="badge" hidden></b></button>
</nav>
<div id="sheet" class="scrim" hidden><section class="sheet" role="dialog" aria-modal="true"></section></div>
<div id="toast" role="status" hidden></div>
</body>
</html>
