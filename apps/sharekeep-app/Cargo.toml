[package]
name = "sharekeep-app"
description = "ShareKeep for Windows and macOS: the household's shared finances, synced through the hub on the home Wi-Fi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "sharekeep_app"
path = "src/lib.rs"

[[bin]]
name = "sharekeep"
path = "src/main.rs"

[dependencies]
sk-core.workspace = true
sk-split.workspace = true
sk-chain.workspace = true
sk-ledger.workspace = true
sk-client.workspace = true
sk-ui.workspace = true
sk-report.workspace = true
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }
rfd.workspace = true
directories.workspace = true
qrcodegen.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
base64.workspace = true
# already built for Slint: shrinking photos before they are attached
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# "Make this computer the hub": the administrator prompt (ShellExecuteExW runas) and the wait.
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
sk-hub.workspace = true
sk-store.workspace = true
tempfile.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
